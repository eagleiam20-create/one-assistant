
<script>
(() => {
  "use strict";

  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];

  const KEY = {
    saved: "one20_saved",
    tasks: "one20_tasks",
    lang: "one20_language"
  };

  let currentPlan = null;
  let toastTimer;

  // ONE's built-in rule-based engine.
  // No API, AI model, server or paid dependency.

  const templates = {
    study: {
      title: ["Study action plan", "पढ़ाई की योजना", "Study action plan"],
      summary: [
        "Apne subject aur available time ke hisaab se steps complete karein.",
        "अपने विषय और उपलब्ध समय के अनुसार ये चरण पूरे करें।",
        "Complete these steps according to your subject and available time."
      ],
      tasks: [
        ["Syllabus aur topics ki list banao", "Sabse mushkil topic chuno",
         "Notes aur formulas revise karo", "Practice questions solve karo",
         "Answers check karke mistakes sudharo"],
        ["पाठ्यक्रम और विषयों की सूची बनाएं", "सबसे कठिन विषय चुनें",
         "नोट्स और सूत्र दोहराएं", "अभ्यास प्रश्न हल करें",
         "उत्तर जाँचें और गलतियाँ सुधारें"],
        ["List syllabus topics", "Choose the hardest topic",
         "Review notes and formulas", "Solve practice questions",
         "Check answers and correct mistakes"]
      ]
    },

    budget: {
      title: ["Budget organizer", "बजट व्यवस्थित करें", "Budget organizer"],
      summary: [
        "Yeh general organizing checklist hai, financial advice nahi.",
        "यह सामान्य व्यवस्था की सूची है, वित्तीय सलाह नहीं।",
        "This is a general organizing checklist, not financial advice."
      ],
      tasks: [
        ["Income ya available amount likho", "Zaroori expenses note karo",
         "Optional expenses note karo", "Saving goal likho",
         "Week ke end mein review karo"],
        ["आय या उपलब्ध राशि लिखें", "ज़रूरी खर्च लिखें",
         "वैकल्पिक खर्च लिखें", "बचत का लक्ष्य लिखें",
         "सप्ताह के अंत में समीक्षा करें"],
        ["Write income or available funds", "List essential expenses",
         "List optional expenses", "Set a savings goal",
         "Review at the end of the week"]
      ]
    },

    form: {
      title: ["Form-filling checklist", "फ़ॉर्म भरने की सूची", "Form-filling checklist"],
      summary: [
        "Official instructions follow karein. Password ya OTP kisi ko na dein.",
        "आधिकारिक निर्देश पढ़ें। अपना पासवर्ड या OTP किसी को न दें।",
        "Follow official instructions. Never share your password or OTP."
      ],
      tasks: [
        ["Official website verify karo", "Instructions aur eligibility padho",
         "Required documents ki list banao", "Details carefully fill karo",
         "Submit karne se pehle review karo"],
        ["आधिकारिक वेबसाइट जाँचें", "निर्देश और पात्रता पढ़ें",
         "ज़रूरी दस्तावेज़ों की सूची बनाएं", "जानकारी ध्यान से भरें",
         "जमा करने से पहले दोबारा जाँचें"],
        ["Verify the official website", "Read instructions and eligibility",
         "List required documents", "Fill in details carefully",
         "Review before submitting"]
      ]
    },

    english: {
      title: ["English practice plan", "अंग्रेज़ी अभ्यास योजना", "English practice plan"],
      summary: [
        "Roz thoda practice karein aur apni progress note karein.",
        "रोज़ थोड़ा अभ्यास करें और अपनी प्रगति लिखें।",
        "Practice a little each day and record your progress."
      ],
      tasks: [
        ["5 naye words aur meanings likho", "3 sentences banao",
         "5 minute English padho ya suno", "Apne din par 4 lines likho",
         "Apni mistakes check karo"],
        ["5 नए शब्द और अर्थ लिखें", "3 वाक्य बनाएं",
         "5 मिनट अंग्रेज़ी पढ़ें या सुनें", "अपने दिन पर 4 पंक्तियाँ लिखें",
         "अपनी गलतियाँ जाँचें"],
        ["Write 5 new words and meanings", "Make 3 sentences",
         "Read or listen to English for 5 minutes", "Write 4 lines about your day",
         "Check your mistakes"]
      ]
    },

    project: {
      title: ["Project action plan", "प्रोजेक्ट की योजना", "Project action plan"],
      summary: [
        "Bade project ko chhote aur manageable steps mein baanto.",
        "बड़े प्रोजेक्ट को छोटे और आसान चरणों में बाँटें।",
        "Break a large project into small, manageable steps."
      ],
      tasks: [
        ["Project ka goal likho", "Sabse zaroori features chuno",
         "Pehla simple version banao", "Har feature ko test karo",
         "Feedback lekar improvements karo"],
        ["प्रोजेक्ट का लक्ष्य लिखें", "ज़रूरी सुविधाएँ चुनें",
         "पहला सरल संस्करण बनाएं", "हर सुविधा की जाँच करें",
         "सुझाव लेकर सुधार करें"],
        ["Write the project goal", "Choose essential features",
         "Build a simple first version", "Test each feature",
         "Improve it using feedback"]
      ]
    },

    daily: {
      title: ["Daily action plan", "रोज़ के कामों की योजना", "Daily action plan"],
      summary: [
        "Apne din ko organize karne ke liye ye simple steps use karein.",
        "अपने दिन को व्यवस्थित करने के लिए ये आसान चरण अपनाएं।",
        "Use these simple steps to organize your day."
      ],
      tasks: [
        ["Aaj ke kaam likho", "Sabse zaroori kaam chuno",
         "Kaam ko chhote steps mein todo", "Ek kaam se shuru karo",
         "Din ke end mein progress check karo"],
        ["आज के काम लिखें", "सबसे ज़रूरी काम चुनें",
         "काम को छोटे चरणों में बाँटें", "एक काम से शुरुआत करें",
         "दिन के अंत में प्रगति जाँचें"],
        ["List today's tasks", "Choose the most important task",
         "Break it into smaller steps", "Start with one task",
         "Review your progress at day's end"]
      ]
    },

    generic: {
      title: ["Next-step checklist", "अगले कदमों की सूची", "Next-step checklist"],
      summary: [
        "Yeh general sample checklist hai. Apni situation ke hisaab se badlein.",
        "यह सामान्य नमूना सूची है। अपनी स्थिति के अनुसार बदलें।",
        "This is a general sample checklist. Adapt it to your situation."
      ],
      tasks: [
        ["Apna goal ek sentence mein likho", "Kaam ko chhote steps mein todo",
         "Sabse aasaan step se shuru karo", "Zaroori information verify karo",
         "Progress review karke next step chuno"],
        ["अपना लक्ष्य एक वाक्य में लिखें", "काम को छोटे चरणों में बाँटें",
         "सबसे आसान चरण से शुरू करें", "ज़रूरी जानकारी जाँचें",
         "प्रगति देखकर अगला चरण चुनें"],
        ["Write your goal in one sentence", "Break the work into small steps",
         "Start with the easiest step", "Verify important information",
         "Review progress and choose the next step"]
      ]
    }
  };

  function langIndex() {
    const l = $("#language").value;
    return l === "hi" ? 1 : l === "en" ? 2 : 0;
  }

  function read(key, fallback) {
    try {
      const value = localStorage.getItem(key);
      return value ? JSON.parse(value) : fallback;
    } catch {
      return fallback;
    }
  }

  function write(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch {
      notify("Save nahi hua. Browser storage full ho sakti hai.");
      return false;
    }
  }

  function notify(message) {
    const toast = $("#toast");
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2500);
  }

  function classify(question) {
    const q = question.toLowerCase();

    if (/study|science|math|exam|test|revision|padhai|homework|syllabus|पढ़ाई|परीक्षा|गणित|विज्ञान/.test(q))
      return "study";

    if (/budget|expense|saving|money|kharch|paisa|बजट|खर्च|बचत|पैसा/.test(q))
      return "budget";

    if (/form|application|document|दस्तावेज़|फॉर्म|आवेदन/.test(q))
      return "form";

    if (/english|vocabulary|grammar|अंग्रेज़ी|अंग्रेजी|व्याकरण/.test(q))
      return "english";

    if (/project|website|app|coding|code|program|programming|प्रोजेक्ट|ऐप|वेबसाइट/.test(q))
      return "project";

    if (/daily|routine|schedule|today|tomorrow|plan my day|din ka plan|दिनचर्या|आज के काम|कल का प्लान/.test(q))
      return "daily";

    return "generic";
  }

  function makePlan(question) {
    const key = classify(question);
    const t = templates[key];
    const i = langIndex();

    return {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      question,
      key,
      title: t.title[i],
      summary: t.summary[i],
      tasks: t.tasks[i].map((text, index) => ({
        id: "task-" + index,
        text,
        done: false
      })),
      createdAt: new Date().toISOString()
    };
  }

  function updateProgress() {
    if (!currentPlan) return;

    const total = currentPlan.tasks.length;
    const done = currentPlan.tasks.filter(t => t.done).length;

    $("#progressBar").style.width =
      (total ? done / total * 100 : 0) + "%";

    $("#progressText").textContent =
      `${done} of ${total} tasks complete`;
  }

  function renderPlan(plan) {
    currentPlan = plan;
    $("#resultTitle").textContent = plan.title;
    $("#resultSummary").textContent = plan.summary;

    const list = $("#checklist");
    list.replaceChildren();

    plan.tasks.forEach(task => {
      const label = document.createElement("label");
      label.className = "task" + (task.done ? " done" : "");

      const input = document.createElement("input");
      input.type = "checkbox";
      input.checked = !!task.done;
      input.setAttribute("aria-label", task.text);

      input.addEventListener("change", () => {
        task.done = input.checked;
        label.classList.toggle("done", task.done);
        updateProgress();
      });

      const span = document.createElement("span");
      span.textContent = task.text;

      label.append(input, span);
      list.append(label);
    });

    $("#result").classList.add("show");
    updateProgress();
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[c]);
  }

  function renderSaved() {
    const saved = read(KEY.saved, []);

    const html = saved.length
      ? saved.map(p => `
        <article class="saved-item">
          <strong>${escapeHTML(p.title)}</strong>
          <small>${escapeHTML(p.question)} ·
          ${p.tasks.filter(t => t.done).length}/${p.tasks.length} complete</small>
          <div>
            <button class="small-btn" type="button" data-open="${escapeHTML(p.id)}">Open</button>
            <button class="small-btn" type="button" data-delete="${escapeHTML(p.id)}">Delete</button>
          </div>
        </article>
      `).join("")
      : '<div class="empty">Abhi koi saved plan nahi hai.</div>';

    $("#recentList").innerHTML = html;
    $("#allSaved").innerHTML = html;
  }

  function saveCurrent() {
    if (!currentPlan) {
      notify("Pehle ek plan banayein.");
      return;
    }

    const saved = read(KEY.saved, []);
    const copy = {
      ...currentPlan,
      tasks: currentPlan.tasks.map(t => ({ ...t })),
      updatedAt: new Date().toISOString()
    };

    const index = saved.findIndex(p => p.id === copy.id);

    if (index >= 0) saved[index] = copy;
    else saved.unshift(copy);

    if (write(KEY.saved, saved)) {
      renderSaved();
      notify("Plan save/update ho gaya!");
    }
  }

  function showView(view) {
    const views = {
      home: "#homeView",
      space: "#spaceView",
      planner: "#plannerView",
      settings: "#settingsView"
    };

    Object.entries(views).forEach(([name, selector]) => {
      $(selector).hidden = name !== view;
    });

    $$(".nav button").forEach(button => {
      button.classList.toggle("active", button.dataset.view === view);
    });

    if (view === "space") renderSaved();
    if (view === "planner") renderPlanner();

    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function renderPlanner() {
    const tasks = read(KEY.tasks, []);
    const list = $("#plannerTasks");
    list.replaceChildren();

    if (!tasks.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Abhi tasks nahi hain. Upar ek task add karein.";
      list.append(empty);
      return;
    }

    tasks.forEach(task => {
      const label = document.createElement("label");
      label.className = "task" + (task.done ? " done" : "");

      const input = document.createElement("input");
      input.type = "checkbox";
      input.checked = !!task.done;
      input.dataset.taskId = task.id;
      input.setAttribute("aria-label", "Complete " + task.text);

      const span = document.createElement("span");
      span.textContent = task.text;

      label.append(input, span);
      list.append(label);
    });
  }

  function updateLanguage() {
    const i = langIndex();

    $("#greeting").textContent =
      i === 1 ? "नमस्ते! 👋" : "Hi! 👋";

    $("#intro").textContent = [
      "Main ONE hoon — aapka everyday life assistant. Hindi, Hinglish ya English mein poochiye.",
      "मैं ONE हूँ — आपका रोज़मर्रा का सहायक। हिंदी, Hinglish या English में पूछें।",
      "I'm ONE — your everyday life assistant. Ask in Hindi, Hinglish, or English."
    ][i];

    $("#question").placeholder = [
      "Koi bhi sawaal poochiye...",
      "अपना सवाल लिखें...",
      "Ask a question..."
    ][i];

    write(KEY.lang, $("#language").value);
  }

  $("#askForm").addEventListener("submit", event => {
    event.preventDefault();

    const question = $("#question").value.trim();
    if (!question) return;

    renderPlan(makePlan(question));
  });

  $$("[data-example]").forEach(button => {
    button.addEventListener("click", () => {
      $("#question").value = button.dataset.example;
      $("#question").focus();
    });
  });

  $$("[data-quick]").forEach(button => {
    button.addEventListener("click", () => {
      const action = button.dataset.quick;

      if (action === "space") return showView("space");
      if (action === "planner") return showView("planner");

      if (action === "simple") {
        $("#question").value = "Explain a difficult topic in simple words";
        $("#question").focus();
        notify("Simple checklist mode selected.");
        return;
      }

      $("#question").focus();
    });
  });

  $("#addPlanTaskForm").addEventListener("submit", event => {
    event.preventDefault();

    if (!currentPlan) return notify("Pehle ek plan banayein.");

    const input = $("#newPlanTask");
    const text = input.value.trim();

    if (!text) return;
    if (currentPlan.tasks.length >= 100) {
      return notify("Ek plan mein maximum 100 tasks.");
    }

    currentPlan.tasks.push({
      id: "custom-" + Date.now().toString(36),
      text,
      done: false
    });

    input.value = "";
    renderPlan(currentPlan);
    notify("Task add ho gaya!");
  });

  $("#savePlan").addEventListener("click", saveCurrent);

  $("#clearPlan").addEventListener("click", () => {
    $("#result").classList.remove("show");
    $("#newPlanTask").value = "";
    currentPlan = null;
  });

  $("#viewSaved").addEventListener("click", () => showView("space"));

  $$("[data-view]").forEach(button => {
    button.addEventListener("click", () => showView(button.dataset.view));
  });

  document.addEventListener("click", event => {
    const open = event.target.closest("[data-open]");

    if (open) {
      const plan = read(KEY.saved, [])
        .find(p => p.id === open.dataset.open);

      if (plan) {
        showView("home");
        renderPlan({
          ...plan,
          tasks: plan.tasks.map(t => ({ ...t }))
        });
      }
    }

    const del = event.target.closest("[data-delete]");

    if (del) {
      write(
        KEY.saved,
        read(KEY.saved, []).filter(p => p.id !== del.dataset.delete)
      );

      renderSaved();
      notify("Saved plan deleted.");
    }
  });

  $("#language").addEventListener("change", updateLanguage);

  $("#taskForm").addEventListener("submit", event => {
    event.preventDefault();

    const input = $("#newTask");
    const text = input.value.trim();
    if (!text) return;

    const tasks = read(KEY.tasks, []);

    tasks.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      text,
      done: false
    });

    if (write(KEY.tasks, tasks)) {
      input.value = "";
      renderPlanner();
      notify("Task added.");
    }
  });

  $("#plannerTasks").addEventListener("change", event => {
    const id = event.target.dataset.taskId;
    if (!id) return;

    const tasks = read(KEY.tasks, []);
    const task = tasks.find(t => t.id === id);

    if (task) task.done = event.target.checked;

    if (write(KEY.tasks, tasks)) renderPlanner();
  });

  $("#clearDone").addEventListener("click", () => {
    write(KEY.tasks, read(KEY.tasks, []).filter(t => !t.done));
    renderPlanner();
    notify("Completed tasks removed.");
  });

  $("#exportData").addEventListener("click", () => {
    const data = {
      savedPlans: read(KEY.saved, []),
      plannerTasks: read(KEY.tasks, [])
    };

    const blob = new Blob(
      [JSON.stringify(data, null, 2)],
      { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "one-my-data.json";
    document.body.append(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
    notify("Data export ready.");
  });

  $("#deleteData").addEventListener("click", () => {
    if (!confirm("ONE ke saved plans aur tasks delete kar dein?")) return;

    Object.values(KEY).forEach(key => localStorage.removeItem(key));

    currentPlan = null;
    $("#result").classList.remove("show");

    renderSaved();
    renderPlanner();
    notify("Local data deleted.");
  });

  const savedLang = read(KEY.lang, "hinglish");

  $("#language").value =
    ["hinglish", "hi", "en"].includes(savedLang)
      ? savedLang
      : "hinglish";

  updateLanguage();
  renderSaved();
  renderPlanner();
})();
</script>
